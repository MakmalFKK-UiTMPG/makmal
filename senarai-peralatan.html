<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senarai Peralatan Makmal FKK UiTM Pasir Gudang</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        .custom-scrollbar::-webkit-scrollbar {
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-800 antialiased min-h-screen">

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

        <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 mb-6">
            <a href="makmal.html" class="inline-flex items-center space-x-2 text-sm font-semibold text-slate-600 hover:text-indigo-600 transition group">
                <i data-lucide="arrow-left" class="w-4 h-4 transition-transform group-hover:-translate-x-1"></i>
                <span>Kembali ke Menu Utama</span>
            </a>
            <a href="tempahan.html" class="inline-flex items-center space-x-2 text-sm font-semibold text-teal-700 bg-teal-50 hover:bg-teal-100 px-3.5 py-2 rounded-xl transition border border-teal-200">
                <i data-lucide="flask-conical" class="w-4 h-4"></i>
                <span>Tempahan Peralatan Makmal</span>
            </a>
        </div>

        <header class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm mb-8 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
            <div>
                <span class="text-xs font-bold uppercase tracking-wider text-indigo-600">Direktori Inventori</span>
                <h1 class="text-xl sm:text-2xl font-bold text-slate-900 mt-0.5">Senarai Peralatan & Instrumen Makmal FKK</h1>
                <p class="text-xs sm:text-sm text-slate-500 mt-1">Status peralatan akan dikemaskini secara berkala</p>
            </div>
            
            <div class="flex items-center space-x-3 w-full sm:w-auto">
                <a href="https://docs.google.com/spreadsheets/d/153J0APri9Lcmw4iXGaIHJ8wZmOBWxFJg/edit?usp=drive_link&ouid=116772226739060700883&rtpof=true&sd=true" 
                   target="_blank" 
                   rel="noopener noreferrer"
                   class="inline-flex items-center justify-center space-x-2 bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2.5 rounded-xl font-bold text-xs sm:text-sm transition shadow-sm border border-emerald-500 w-full sm:w-auto">
                    <i data-lucide="file-spreadsheet" class="w-4 h-4"></i>
                    <span>Kemaskini Status Peralatan (Staf Makmal)</span>
                    <i data-lucide="external-link" class="w-3.5 h-3.5 opacity-70"></i>
                </a>

                <div class="p-3 bg-indigo-50 text-indigo-600 rounded-2xl hidden sm:block">
                    <i data-lucide="microscope" class="w-6 h-6"></i>
                </div>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
            <div class="relative md:col-span-2">
                <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                    <i data-lucide="search" class="w-5 h-5"></i>
                </div>
                <input type="text" id="carianInput" onkeyup="cariPeralatan()" placeholder="Cari nama peralatan, jenama, model, atau pegawai (PIC)..." class="w-full pl-10 pr-4 py-3 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent shadow-sm transition">
            </div>

            <div>
                <select id="labFilter" onchange="filterMakmal()" class="w-full py-3 px-4 bg-white border border-slate-200 rounded-xl text-sm font-medium text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-sm transition cursor-pointer">
                    <option value="all">Semua Makmal</option>
                </select>
            </div>
        </div>

        <div id="bekasMakmal">
            <div class="p-12 text-center text-slate-400 bg-white border border-slate-200 rounded-2xl shadow-sm">
                <div class="w-8 h-8 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin mx-auto mb-3"></div>
                <p class="font-medium text-sm">Memuatkan data...</p>
            </div>
        </div>

        <footer class="mt-12 text-center text-xs text-slate-400">
            &copy; Hak Cipta Terpelihara Fakulti Kejuruteraan Kimia UiTM Pasir Gudang.
        </footer>

    </div>

    <script>
        // SENARAI PAUTAN CSV DARI SETIAP TAB GOOGLE SHEET PERALATAN
        const googleSheetCsvUrls = [
            'https://docs.google.com/spreadsheets/d/e/2PACX-1vT9_TAPPghJkgxCPABwbMNc6bKJPl08zOPPW2vp7hxLqy0zjW54WrC5M0dmEJmmeA/pub?gid=548558397&single=true&output=csv',
            'https://docs.google.com/spreadsheets/d/e/2PACX-1vT9_TAPPghJkgxCPABwbMNc6bKJPl08zOPPW2vp7hxLqy0zjW54WrC5M0dmEJmmeA/pub?gid=680702223&single=true&output=csv'
        ];

        let senaraiPeralatan = [];

        function ambilDataCsv(url) {
            return new Promise((resolve, reject) => {
                Papa.parse(url, {
                    download: true,
                    header: false,
                    skipEmptyLines: true,
                    complete: function(results) {
                        resolve(results.data);
                    },
                    error: function(err) {
                        reject(err);
                    }
                });
            });
        }

        async function muatDataGoogleSheet() {
            try {
                const semuaTabResults = await Promise.all(googleSheetCsvUrls.map(url => ambilDataCsv(url)));
                let parsedPeralatan = [];

                semuaTabResults.forEach(rawRows => {
                    let currentLab = 'MAKMAL UNKNOWN';
                    let currentLabUpdate = 'Kemaskini Automatik';

                    rawRows.forEach(row => {
                        const colB = row[1] ? row[1].toString().trim() : '';
                        const colC = row[2] ? row[2].toString().trim() : '';
                        
                        const fullRowText = row.join(' ');
                        if (fullRowText.toLowerCase().includes('last update')) {
                            const match = fullRowText.match(/last update\s*:\s*([^\s,]+(?:\s+[^\s,]+)?)/i);
                            if (match && match[0]) {
                                currentLabUpdate = match[0];
                            }
                        }

                        if (colB.toUpperCase().startsWith('MAKMAL')) {
                            currentLab = colB;
                            return;
                        }

                        if (colB === 'Bil.' || colB === 'Bil' || colB === '' || colC === 'Nama Peralatan' || colC === '') {
                            return;
                        }

                        if (colC !== '' && colC !== '-') {
                            const jenama = row[3] ? row[3].trim() : '';  
                            const model = row[4] ? row[4].trim() : '';   
                            
                            let jenamaModel = '-';
                            if (jenama && model) {
                                jenamaModel = `${jenama} / ${model}`;
                            } else if (jenama) {
                                jenamaModel = jenama;
                            } else if (model) {
                                jenamaModel = model;
                            }

                            parsedPeralatan.push({
                                Makmal: currentLab,
                                TarikhKemaskini: currentLabUpdate,
                                NamaPeralatan: colC,
                                JenamaModel: jenamaModel,
                                Kuantiti: row[5] ? row[5].trim() : '1 unit', 
                                Status: row[6] ? row[6].trim() : 'available',  
                                PIC: row[7] ? row[7].trim() : '-'               
                            });
                        }
                    });
                });

                senaraiPeralatan = parsedPeralatan;
                binaPilihanMakmal(senaraiPeralatan);
                paparkanPeralatan(senaraiPeralatan);

            } catch (err) {
                console.error("Gagal membaca pautan CSV:", err);
                document.getElementById('bekasMakmal').innerHTML = `
                    <div class="p-8 text-center text-rose-500 bg-rose-50 border border-rose-200 rounded-2xl">
                        ❌ Gagal membaca Google Sheets. Sila pastikan pautan CSV telah dimasukkan dengan betul.
                    </div>
                `;
            }
        }

        function binaPilihanMakmal(data) {
            const labFilter = document.getElementById('labFilter');
            const senaraiMakmal = new Set();

            data.forEach(item => {
                if(item.Makmal) senaraiMakmal.add(item.Makmal);
            });

            labFilter.innerHTML = `<option value="all">Semua Makmal</option>`;
            senaraiMakmal.forEach(makmal => {
                const option = document.createElement('option');
                option.value = makmal.toLowerCase().replace(/\s+/g, '-');
                option.textContent = makmal;
                labFilter.appendChild(option);
            });
        }

        function paparkanPeralatan(data) {
            const bekas = document.getElementById('bekasMakmal');
            bekas.innerHTML = '';

            if (data.length === 0) {
                bekas.innerHTML = `<div class="p-8 text-center text-slate-400 bg-white border border-slate-200 rounded-2xl">Tiada peralatan dijumpai.</div>`;
                return;
            }

            const makmalGrouped = {};
            data.forEach(item => {
                const namaMakmal = item.Makmal;
                if (!makmalGrouped[namaMakmal]) {
                    makmalGrouped[namaMakmal] = {
                        tarikh: item.TarikhKemaskini,
                        items: []
                    };
                }
                makmalGrouped[namaMakmal].items.push(item);
            });

            Object.keys(makmalGrouped).forEach(namaMakmal => {
                const labId = namaMakmal.toLowerCase().replace(/\s+/g, '-');
                const group = makmalGrouped[namaMakmal];

                let rowsHtml = '';
                group.items.forEach((item, index) => {
                    let statusBadge = '';
                    const statusText = item.Status || 'available';
                    const statusLower = statusText.toLowerCase();

                    if (statusLower.includes('maintenance') || statusLower.includes('penyelenggaraan')) {
                        statusBadge = `<span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold bg-amber-50 text-amber-700 border border-amber-200">${statusText}</span>`;
                    } else if (statusLower.includes('unavailable') || statusLower.includes('rosak') || statusLower.includes('tidak')) {
                        statusBadge = `<span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold bg-rose-50 text-rose-700 border border-rose-200">${statusText}</span>`;
                    } else {
                        statusBadge = `<span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200">${statusText}</span>`;
                    }

                    rowsHtml += `
                        <tr class="item-row hover:bg-slate-50/80 transition border-b border-slate-100">
                            <td class="py-3.5 px-4 text-center font-medium text-slate-400">${index + 1}</td>
                            <td class="py-3.5 px-4 font-bold text-slate-800">${item.NamaPeralatan}</td>
                            <td class="py-3.5 px-4 text-slate-600 font-mono text-xs">${item.JenamaModel}</td>
                            <td class="py-3.5 px-4 text-center font-semibold text-slate-700">${item.Kuantiti}</td>
                            <td class="py-3.5 px-4">${statusBadge}</td>
                            <td class="py-3.5 px-4 text-slate-600 font-medium">${item.PIC}</td>
                        </tr>
                    `;
                });

                const sectionHtml = `
                    <div class="lab-section bg-white border border-slate-200 rounded-2xl shadow-sm mb-8 overflow-hidden" data-lab="${labId}">
                        <div class="bg-slate-900 text-white px-6 py-4 flex items-center justify-between">
                            <div class="flex items-center space-x-2">
                                <i data-lucide="building-2" class="w-5 h-5 text-indigo-400"></i>
                                <h2 class="font-bold text-sm sm:text-base">${namaMakmal.toUpperCase()}</h2>
                            </div>
                            <span class="text-xs text-slate-400 font-medium">${group.tarikh}</span>
                        </div>
                        <div class="overflow-x-auto custom-scrollbar">
                            <table class="w-full text-left border-collapse min-w-[700px]">
                                <thead>
                                    <tr class="bg-slate-50 border-b border-slate-200 text-xs font-semibold uppercase tracking-wider text-slate-500">
                                        <th class="py-3 px-4 w-12 text-center">Bil</th>
                                        <th class="py-3 px-4">Nama Peralatan</th>
                                        <th class="py-3 px-4">Jenama / Model</th>
                                        <th class="py-3 px-4 w-28 text-center">Kuantiti</th>
                                        <th class="py-3 px-4 w-40">Status</th>
                                        <th class="py-3 px-4 w-48">Pegawai (PIC)</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100 text-sm">
                                    ${rowsHtml}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
                bekas.innerHTML += sectionHtml;
            });

            lucide.createIcons();
        }

        function cariPeralatan() {
            let input = document.getElementById('carianInput').value.toLowerCase();
            let labSections = document.querySelectorAll('.lab-section');

            labSections.forEach(section => {
                let rows = section.querySelectorAll('.item-row');
                let hasMatch = false;

                rows.forEach(row => {
                    let text = row.innerText.toLowerCase();
                    if (text.includes(input)) {
                        row.style.display = "";
                        hasMatch = true;
                    } else {
                        row.style.display = "none";
                    }
                });

                if (hasMatch) {
                    section.style.display = "";
                } else {
                    section.style.display = "none";
                }
            });
        }

        function filterMakmal() {
            let selectedLab = document.getElementById('labFilter').value;
            let labSections = document.querySelectorAll('.lab-section');

            document.getElementById('carianInput').value = "";

            labSections.forEach(section => {
                let rows = section.querySelectorAll('.item-row');
                rows.forEach(row => row.style.display = "");

                if (selectedLab === 'all' || section.getAttribute('data-lab') === selectedLab) {
                    section.style.display = "";
                } else {
                    section.style.display = "none";
                }
            });
        }

        window.onload = function() {
            lucide.createIcons();
            muatDataGoogleSheet();
        };
    </script>
</body>
</html>
