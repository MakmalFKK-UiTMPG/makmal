<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semakan Status Permohonan Bahan & Radas</title>
    
    <!-- TAILWIND CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- LUCIDE ICONS CDN -->
    <script src="https://unpkg.com/@lucide/web"></script>
    <!-- SUPABASE SDK -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

    <style>
        .custom-scrollbar::-webkit-scrollbar {
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-800 antialiased min-h-screen">

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

        <!-- HEADER NAVIGASI / TOP BAR -->
        <div class="flex items-center justify-between gap-4 mb-6">
            <a href="bahan-radas.html" class="inline-flex items-center space-x-2 text-sm font-semibold text-slate-600 hover:text-emerald-600 transition group">
                <i data-lucide="arrow-left" class="w-4 h-4 transition-transform group-hover:-translate-x-1"></i>
                <span>Kembali ke Borang Permohonan</span>
            </a>
            <a href="makmal.html" class="inline-flex items-center space-x-2 text-sm font-semibold text-slate-500 hover:text-slate-800 transition">
                <i data-lucide="home" class="w-4 h-4"></i>
                <span>Menu Utama Makmal</span>
            </a>
        </div>

        <!-- TAJUK UTAMA & CARIAN -->
        <div class="bg-white border border-slate-200 rounded-2xl p-6 sm:p-8 shadow-sm mb-8">
            <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 pb-6 border-b border-slate-100">
                <div>
                    <span class="text-xs font-bold uppercase tracking-wider text-emerald-600">Portals Semakan Digital</span>
                    <h1 class="text-xl sm:text-2xl font-bold text-slate-900 mt-0.5">Semakan Status Permohonan Bahan & Radas</h1>
                    <p class="text-xs sm:text-sm text-slate-500 mt-1">Masukkan No. ID (Pelajar / Staf) anda untuk melihat keseluruhan perincian permohonan dan catatan Pegawai Makmal.</p>
                </div>
                <div class="p-3 bg-emerald-50 text-emerald-600 rounded-2xl hidden sm:block">
                    <i data-lucide="file-search" class="w-8 h-8"></i>
                </div>
            </div>

            <!-- KOTAK CARIAN -->
            <div class="mt-6 flex flex-col sm:flex-row gap-3">
                <div class="relative flex-1">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                        <i data-lucide="id-card" class="w-5 h-5"></i>
                    </div>
                    <input type="text" id="noIdCarian" placeholder="Masukkan No. ID (Contoh: 2023123456)" class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition">
                </div>
                <button onclick="semakStatus()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-6 rounded-xl shadow-md transition duration-200 flex items-center justify-center space-x-2 cursor-pointer text-sm">
                    <i data-lucide="search" class="w-4 h-4"></i>
                    <span>Cari Permohonan</span>
                </button>
            </div>
        </div>

        <!-- BEKAS KEPUTUSAN HASIL CARIAN -->
        <div id="hasilKeputusan"></div>

        <!-- FOOTER -->
        <footer class="mt-12 text-center text-xs text-slate-400">
            &copy; Hak Cipta Terpelihara Fakulti Kejuruteraan Kimia UiTM Pasir Gudang.
        </footer>

    </div>

    <!-- SKRIP SUPABASE & CARIAN STATUS -->
    <script>
        const supabaseUrl = 'https://mxrtxeczzebkrzayacwy.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im14cnR4ZWN6emVia3J6YXlhY3d5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyNTU5MDIsImV4cCI6MjEwMjgzMTkwMn0.nsZRuzUpelmfaMiw5fozucrc2XsaaZFxm8Mu28G3wzw';
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

        window.onload = function() {
            lucide.createIcons();
        };

        async function semakStatus() {
            const noId = document.getElementById('noIdCarian').value.trim();
            const divHasil = document.getElementById('hasilKeputusan');

            if (!noId) {
                alert("Sila masukkan No. ID anda.");
                return;
            }

            divHasil.innerHTML = `
                <div class="flex items-center justify-center space-x-2 p-8 bg-white border border-slate-200 rounded-2xl shadow-sm text-slate-500 text-sm">
                    <div class="w-5 h-5 border-2 border-emerald-600 border-t-transparent rounded-full animate-spin"></div>
                    <span>Sedang mencari rekod permohonan...</span>
                </div>
            `;

            const { data, error } = await supabaseClient
                .from('permohonan_bahan_radas')
                .select('*')
                .eq('no_id', noId)
                .order('id', { ascending: false });

            if (error) {
                divHasil.innerHTML = `
                    <div class="p-4 bg-rose-50 border border-rose-200 text-rose-700 rounded-xl text-sm font-semibold flex items-center space-x-2">
                        <i data-lucide="alert-circle" class="w-5 h-5"></i>
                        <span>Ralat carian: ${error.message}</span>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            if (!data || data.length === 0) {
                divHasil.innerHTML = `
                    <div class="p-6 bg-rose-50 border border-rose-200 text-rose-700 rounded-2xl text-sm font-semibold text-center flex flex-col items-center justify-center space-y-2">
                        <i data-lucide="file-x-2" class="w-10 h-10 text-rose-500"></i>
                        <p>Tiada rekod permohonan dijumpai untuk No. ID ini.</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            let html = `
                <div class="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden">
                    <div class="p-4 bg-slate-900 text-white font-bold text-sm flex items-center space-x-2">
                        <i data-lucide="list-checks" class="w-4 h-4 text-emerald-400"></i>
                        <span>Keputusan Carian Permohonan</span>
                    </div>
                    <div class="overflow-x-auto custom-scrollbar">
                        <table class="w-full text-left border-collapse min-w-[850px]">
                            <thead>
                                <tr class="bg-slate-50 border-b border-slate-200 text-xs font-semibold uppercase tracking-wider text-slate-500">
                                    <th class="py-3 px-4 w-28">Tarikh</th>
                                    <th class="py-3 px-4 w-52">Pemohon & Projek</th>
                                    <th class="py-3 px-4">Senarai Item Dipohon</th>
                                    <th class="py-3 px-4 w-32">Status</th>
                                    <th class="py-3 px-4 w-60">Catatan Pegawai</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-100 text-sm">
            `;

            data.forEach(r => {
                const tarikh = new Date(r.created_at).toLocaleDateString('ms-MY');
                const statusTxt = r.status || 'Menunggu';
                
                let statusBadge = '<span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold bg-amber-50 text-amber-700 border border-amber-200">Menunggu</span>';
                if (statusTxt.toLowerCase().includes('lulus')) {
                    statusBadge = '<span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200">Lulus</span>';
                }
                if (statusTxt.toLowerCase().includes('tolak')) {
                    statusBadge = '<span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold bg-rose-50 text-rose-700 border border-rose-200">Ditolak</span>';
                }

                // Bina Senarai Penuh Bahan Kimia
                let bahanHTML = '';
                if (r.senarai_bahan_kimia && r.senarai_bahan_kimia.length > 0) {
                    bahanHTML = `
                        <div class="mb-2">
                            <span class="font-bold text-slate-800 text-xs block mb-1">🧪 Bahan Kimia:</span>
                            <ul class="list-disc list-inside text-xs text-slate-600 space-y-0.5 pl-1">
                                ${r.senarai_bahan_kimia.map(b => `<li><strong class="text-slate-700">${b.nama}</strong> (${b.kuantiti})</li>`).join('')}
                            </ul>
                        </div>
                    `;
                }

                // Bina Senarai Penuh Alat Radas
                let radasHTML = '';
                if (r.senarai_radas && r.senarai_radas.length > 0) {
                    radasHTML = `
                        <div class="mb-2">
                            <span class="font-bold text-slate-800 text-xs block mb-1">🔬 Alat Radas:</span>
                            <ul class="list-disc list-inside text-xs text-slate-600 space-y-0.5 pl-1">
                                ${r.senarai_radas.map(rad => `<li><strong class="text-slate-700">${rad.nama}</strong> (${rad.kuantiti} unit)</li>`).join('')}
                            </ul>
                        </div>
                    `;
                }

                // Bina Senarai Penuh Peralatan
                let peralatanHTML = '';
                if (r.senarai_peralatan && r.senarai_peralatan.length > 0) {
                    peralatanHTML = `
                        <div class="mb-2">
                            <span class="font-bold text-slate-800 text-xs block mb-1">⚙️ Peralatan Makmal:</span>
                            <ul class="list-disc list-inside text-xs text-slate-600 space-y-0.5 pl-1">
                                ${r.senarai_peralatan.map(p => `<li><strong class="text-slate-700">${p.nama}</strong> (${p.kuantiti} unit)</li>`).join('')}
                            </ul>
                        </div>
                    `;
                }

                // Ahli Kumpulan
                let ahliHTML = '';
                if (r.ahli_kumpulan && r.ahli_kumpulan.length > 0) {
                    ahliHTML = `<div class="mt-2 pt-2 border-t border-slate-100 text-xs text-slate-500"><strong>Ahli:</strong> ${r.ahli_kumpulan.map(a => a.nama).join(', ')}</div>`;
                }

                html += `
                    <tr class="hover:bg-slate-50/80 transition align-top">
                        <td class="py-3.5 px-4 font-mono text-xs text-slate-600">${tarikh}</td>
                        <td class="py-3.5 px-4">
                            <div class="font-bold text-slate-900">${r.nama_pemohon}</div>
                            <div class="text-xs text-slate-500 mt-0.5">ID: ${r.no_id}</div>
                            <div class="text-xs text-slate-500 mt-0.5">Tujuan: ${r.tujuan}</div>
                            <div class="text-xs text-slate-500 mt-0.5">Penyelia: ${r.nama_penyelia || '-'}</div>
                            ${ahliHTML}
                        </td>
                        <td class="py-3.5 px-4">
                            ${bahanHTML}
                            ${radasHTML}
                            ${peralatanHTML}
                            ${(!bahanHTML && !radasHTML && !peralatanHTML) ? '<i class="text-xs text-slate-400">Tiada item direkodkan</i>' : ''}
                        </td>
                        <td class="py-3.5 px-4">${statusBadge}</td>
                        <td class="py-3.5 px-4">
                            ${r.catatan_admin 
                                ? `<div class="p-3 bg-emerald-50/80 border border-emerald-200 rounded-xl text-xs text-slate-700"><strong class="text-emerald-800 block mb-1">Catatan Pegawai:</strong>${r.catatan_admin}</div>` 
                                : '<span class="text-xs text-slate-400 italic">Belum ada catatan dari admin</span>'}
                        </td>
                    </tr>
                `;
            });

            html += `
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
            divHasil.innerHTML = html;
            lucide.createIcons();
        }
    </script>
</body>
</html>
