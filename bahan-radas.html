    // FUNGSI NOTIFIKASI EMEL VIA WEB3FORMS (DENGAN ISOLASI MESEJ RALAT)
    async function hantarNotifikasiEmelAdmin(payload) {
        try {
            const response = await fetch("https://api.web3forms.com/submit", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    Accept: "application/json",
                },
                body: JSON.stringify({
                    access_key: "7bd850af-e5d0-4392-bc51-9f3af1a317d9",
                    subject: `[Notifikasi Permohonan Baru] - ${payload.nama_pemohon} (${payload.no_id})`,
                    from_name: "Portal Makmal FKK",
                    message: `
Salam Pegawai Makmal / Admin FKK,

Terdapat permohonan alat radas/bahan kimia/peralatan makmal baharu yang telah dihantar:

- Nama Pemohon : ${payload.nama_pemohon}
- No. ID       : ${payload.no_id}
- No. Telefon  : ${payload.no_telefon}
- Tujuan       : ${payload.tujuan}
- Tajuk Projek : ${payload.tajuk_projek}
- Penyelia     : ${payload.nama_penyelia}
- Tarikh Mohon : ${new Date().toLocaleString('ms-MY')}

Sila semak pangkalan data Supabase atau portal admin untuk tindakan kelulusan.
                    `
                })
            });

            const result = await response.json();
            if (result.success) {
                console.log("✅ Emel notifikasi berjaya dihantar kepada Pegawai Makmal!");
            } else {
                console.warn("⚠️ Ralat Web3Forms:", result.message);
            }
        } catch (err) {
            console.warn("⚠️ Notifikasi emel tidak dapat dihantar:", err);
        }
    }

    document.getElementById('formPermohonan').addEventListener('submit', async function(e) {
        e.preventDefault();
        const btnHantar = document.getElementById('btnHantar');
        btnHantar.disabled = true;
        btnHantar.innerText = "Sila tunggu... Permohonan sedang dihantar";

        const ahliList = [];
        document.querySelectorAll('#jadualAhli tbody tr').forEach(r => {
            const nama = r.querySelector('.ahli-nama').value;
            const id = r.querySelector('.ahli-id').value;
            if(nama) ahliList.push({ nama, id });
        });

        const radasList = [];
        document.querySelectorAll('#jadualRadas tbody tr').forEach(r => {
            const nama = r.querySelector('.radas-nama').value;
            const kuantiti = r.querySelector('.radas-kuantiti').value;
            if(nama) radasList.push({ nama, kuantiti });
        });

        const peralatanList = [];
        document.querySelectorAll('#jadualPeralatan tbody tr').forEach(r => {
            const nama = r.querySelector('.alat-nama').value;
            const kuantiti = r.querySelector('.alat-kuantiti').value;
            if(nama) peralatanList.push({ nama, kuantiti });
        });

        const bahanList = [];
        document.querySelectorAll('#jadualBahan tbody tr').forEach(r => {
            const nama = r.querySelector('.bahan-nama').value;
            const kuantiti = r.querySelector('.bahan-kuantiti').value;
            if(nama) bahanList.push({ nama, kuantiti });
        });

        const payload = {
            nama_pemohon: document.getElementById('namaPemohon').value,
            no_id: document.getElementById('noId').value,
            no_telefon: document.getElementById('noTelefon').value,
            semester_sesi: document.getElementById('semesterSesi').value,
            tujuan: document.getElementById('tujuan').value,
            tajuk_projek: document.getElementById('tajukProjek').value,
            nama_penyelia: document.getElementById('namaPenyelia').value,
            ahli_kumpulan: ahliList,
            senarai_radas: radasList,
            senarai_peralatan: peralatanList,
            senarai_bahan_kimia: bahanList,
            status: 'Menunggu Kelulusan'
        };

        // SIMPAN DATA KE SUPABASE
        const { data, error } = await supabaseClient
            .from('permohonan_bahan_radas')
            .insert([payload]);

        if (error) {
            console.error("❌ Ralat Supabase:", error);
            alert("❌ Gagal menyimpan ke pangkalan data Supabase: " + error.message);
            btnHantar.disabled = false;
            btnHantar.innerText = "Hantar Permohonan";
        } else {
            // HANTAR NOTIFIKASI EMEL SECARA LATAR BELAKANG
            await hantarNotifikasiEmelAdmin(payload);

            alert("✅ Permohonan anda telah berjaya dihantar untuk kelulusan Pegawai Makmal!");
            window.location.href = "semak-status.html";
        }
    });
