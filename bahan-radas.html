<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borang Permohonan Bahan Kimia, Alat Radas & Peralatan</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@lucide/web"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

    <style>
        .custom-scrollbar::-webkit-scrollbar {
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-800 antialiased min-h-screen">

    <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

        <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 mb-6">
            <div class="flex items-center space-x-3">
                <a href="makmal.html" class="inline-flex items-center space-x-2 text-sm font-semibold text-slate-600 hover:text-indigo-600 transition group">
                    <i data-lucide="arrow-left" class="w-4 h-4 transition-transform group-hover:-translate-x-1"></i>
                    <span>Kembali</span>
                </a>
                <span class="text-slate-300">|</span>
                <a href="semak-status.html" class="inline-flex items-center space-x-2 text-xs font-bold text-emerald-700 bg-emerald-50 hover:bg-emerald-100 px-3 py-1.5 rounded-lg border border-emerald-200 transition">
                    <i data-lucide="search" class="w-3.5 h-3.5"></i>
                    <span>Semak Status Permohonan</span>
                </a>
            </div>
            <button id="logout-btn" class="inline-flex items-center justify-center space-x-2 bg-white hover:bg-rose-50 text-slate-700 hover:text-rose-600 px-4 py-2 rounded-xl font-semibold text-sm transition border border-slate-200 hover:border-rose-200 cursor-pointer shadow-sm">
                <i data-lucide="log-out" class="w-4 h-4"></i>
                <span>Log Keluar</span>
            </button>
        </div>

        <header class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm mb-8 flex flex-col sm:flex-row items-center justify-between gap-4">
            <div>
                <span class="text-xs font-bold uppercase tracking-wider text-emerald-600">PPM-FKK 01/ARBKPM (Ver.02)</span>
                <h1 class="text-xl sm:text-2xl font-bold text-slate-900 mt-0.5">Permohonan Alat Radas / Bahan Kimia / Peralatan Makmal</h1>
                <p class="text-xs sm:text-sm text-slate-500 mt-1">Sila isi permohonan dengan lengkap untuk kegunaan amali atau projek penyelidikan.</p>
            </div>
            <div class="p-3 bg-emerald-50 text-emerald-600 rounded-2xl hidden sm:block">
                <i data-lucide="flask-conical" class="w-8 h-8"></i>
            </div>
        </header>

        <form id="formPermohonan" class="space-y-8">

            <div class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm">
                <div class="flex items-center space-x-3 pb-4 mb-6 border-b border-slate-100">
                    <span class="flex items-center justify-center w-7 h-7 bg-emerald-600 text-white rounded-lg text-xs font-bold">A</span>
                    <h2 class="text-base font-bold text-slate-900">Maklumat Pemohon</h2>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-2">Nama Pemohon *</label>
                        <input type="text" id="namaPemohon" required placeholder="Nama Penuh" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-2">No. ID (Pelajar / Staf) *</label>
                        <input type="text" id="noId" required placeholder="Contoh: 2023123456" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-2">Semester / Sesi / Tahun</label>
                        <input type="text" id="semesterSesi" placeholder="Contoh: Sem 5 / 2026" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-2">Tujuan Penggunaan *</label>
                        <select id="tujuan" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium text-slate-700 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition cursor-pointer">
                            <option value="Projek Tahun Akhir">Projek Tahun Akhir (FYP)</option>
                            <option value="Pengajaran / Amali">Pengajaran / Amali</option>
                            <option value="Lain-lain">Lain-lain</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-2">Tajuk Projek / Amali</label>
                        <input type="text" id="tajukProjek" placeholder="Tajuk Projek" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-2">Nama Penyelia Projek</label>
                        <input type="text" id="namaPenyelia" placeholder="Nama Pensyarah Penyelia" class="w-full px-4
