<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log Masuk - Portal Makmal FKK UiTM</title>
  <style>
    body { 
      font-family: Arial, sans-serif; 
      text-align: center; 
      padding: 50px 20px; 
      background-color: #f4f6f9; 
      margin: 0;
    }
    .card { 
      background: white; 
      padding: 35px; 
      border-radius: 10px; 
      display: inline-block; 
      box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
      max-width: 400px; 
      width: 100%; 
      box-sizing: border-box;
    }
    h2 { color: #2c3e50; margin-bottom: 10px; }
    p { color: #7f8c8d; font-size: 14px; line-height: 1.5; }
    button { 
      background-color: #1a73e8; 
      color: white; 
      border: none; 
      padding: 12px 24px; 
      font-size: 15px; 
      border-radius: 5px; 
      cursor: pointer; 
      margin-top: 20px; 
      font-weight: bold; 
      width: 100%;
      transition: background 0.2s;
    }
    button:hover { background-color: #1557b0; }
    button:disabled { background-color: #a0c3ff; cursor: not-allowed; }
    .error { 
      color: #d93025; 
      font-weight: bold; 
      margin-top: 15px; 
      font-size: 14px; 
      background: #fce8e6; 
      padding: 10px; 
      border-radius: 5px; 
    }
    .tip-box {
      margin-top: 20px;
      font-size: 12px;
      color: #666;
      background-color: #eef2f7;
      padding: 10px;
      border-radius: 6px;
      border-left: 4px solid #1a73e8;
      text-align: left;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Portal Makmal FKK UiTM Pasir Gudang</h2>
    <p id="status-text">Sila log masuk menggunakan e-mel rasmi UiTM untuk mengakses menu utama.</p>
    
    <button id="login-btn">🔑 Log Masuk dengan Google</button>

    <div class="tip-box">
      💡 <strong>Pengguna WhatsApp / iPhone:</strong><br>
      Jika menghadapi masalah log masuk, tekan butang tiga titik (<strong>...</strong>) di penjuru skrin dan pilih <strong>"Open in Safari"</strong> atau <strong>"Open in Chrome"</strong>.
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      GoogleAuthProvider, 
      signInWithPopup, 
      signInWithRedirect, 
      getRedirectResult, 
      onAuthStateChanged, 
      signOut 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDDC9PLSCOzna4caIsrfPSvfR3A_FczKDc",
      authDomain: "sistem-makmal-fkkuitmpg.firebaseapp.com",
      projectId: "sistem-makmal-fkkuitmpg",
      storageBucket: "sistem-makmal-fkkuitmpg.firebasestorage.app",
      messagingSenderId: "291806336887",
      appId: "1:291806336887:web:a0d4fca1866459ead03372"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    const loginBtn = document.getElementById('login-btn');
    const statusText = document.getElementById('status-text');

    // FUNGSI SEMAKAN EMEL RASMI UITM
    function semakAksesEmail(user) {
      const email = user.email || '';
      if (email.endsWith('@uitm.edu.my') || email.endsWith('@student.uitm.edu.my')) {
        statusText.innerHTML = `<span style="color: #27ae60; font-weight: bold;">Log masuk berjaya! Mengalihkan...</span>`;
        setTimeout(() => {
          window.location.href = "makmal.html";
        }, 800);
      } else {
        statusText.innerHTML = `<div class="error">Akses Ditolak!<br>E-mel (${email}) bukan e-mel rasmi UiTM.</div>`;
        signOut(auth);
        loginBtn.disabled = false;
        loginBtn.innerText = "🔑 Log Masuk dengan Google";
      }
    }

    // 1. SEMAK APABILA KEMBALI DARIPADA PROSES REDIRECT (JIKA DIPANGGIL)
    getRedirectResult(auth)
      .then((result) => {
        if (result && result.user) {
          semakAksesEmail(result.user);
        }
      })
      .catch((error) => {
        console.warn("Redirect result error:", error);
      });

    // 2. SEMAK STATUS PENDAFTARAN SEDIA ADA
    onAuthStateChanged(auth, (user) => {
      if (user) {
        semakAksesEmail(user);
      }
    });

    // 3. LOGIK LOG MASUK HYBRID PINTAR
    loginBtn.addEventListener('click', async () => {
      loginBtn.disabled = true;
      loginBtn.innerText = "⏳ Sedang Memproses...";

      try {
        // PERCUBAAN 1: Gunakan Popup (Sangat stabil di WhatsApp In-App Browser)
        const result = await signInWithPopup(auth, provider);
        semakAksesEmail(result.user);
      } catch (error) {
        console.error("Popup Error:", error.code, error.message);

        // JIKA POPUP DISEKAT OLEH PELAYAR (Cth: Safari iPhone)
        if (error.code === 'auth/popup-blocked' || error.code === 'auth/cancelled-popup-request') {
          try {
            // PERCUBAAN 2: Beralih ke Redirect secara automatik
            await signInWithRedirect(auth, provider);
          } catch (redirectErr) {
            statusText.innerHTML = `<div class="error">Ralat Log Masuk: Sila buka pautan ini di luar aplikasi WhatsApp (Guna Safari/Chrome).</div>`;
            loginBtn.disabled = false;
            loginBtn.innerText = "🔑 Log Masuk dengan Google";
          }
        } else if (error.code !== 'auth/popup-closed-by-user') {
          statusText.innerHTML = `<div class="error">Ralat: ${error.message}</div>`;
          loginBtn.disabled = false;
          loginBtn.innerText = "🔑 Log Masuk dengan Google";
        } else {
          // Pengguna menutup tetingkap popup sendiri
          loginBtn.disabled = false;
          loginBtn.innerText = "🔑 Log Masuk dengan Google";
        }
      }
    });
  </script>
</body>
</html>
